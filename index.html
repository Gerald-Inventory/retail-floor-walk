<script>
    function renderObservations() {
        const list = document.getElementById('observations-list');
        list.innerHTML = ''; // Clear the list
        
        if (observations.length === 0) {
            list.innerHTML = `<p style="text-align:center; color:#999; margin:40px 0;">No concerns captured yet. Tap the blue button to start.</p>`;
            return;
        }
        
        observations.forEach(obs => {
            const card = document.createElement('div');
            card.className = 'observation-card';
            card.innerHTML = `
                <button class="delete-btn" onclick="deleteObs(${obs.id})">×</button>
                <img src="${obs.image}" class="obs-image">
                <div class="obs-content">
                    <label style="font-weight:bold; font-size:12px; color:var(--primary); display:block; margin-bottom:5px;">REMARKS & SUGGESTIONS:</label>
                    <textarea class="input-field" 
                        style="height:100px; border:2px solid #eee; background:#fff;" 
                        placeholder="Describe the issue and required action..." 
                        oninput="updateRemark(${obs.id}, this.value)">${obs.remark}</textarea>
                </div>
            `;
            list.appendChild(card);
        });
    }

    // This ensures data is saved character-by-character as you type
    function updateRemark(id, text) {
        const obs = observations.find(o => o.id === id);
        if (obs) {
            obs.remark = text;
            // Silently save to localStorage without re-rendering
            localStorage.setItem('floorWalkObs', JSON.stringify(observations));
        }
    }
</script>
